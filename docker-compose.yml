# Postgres with pgvector, Ollama with the two models, and the Footnote API.
#
#   ./scripts/get-data.sh
#   docker compose up -d db ollama
#   docker compose run --rm models          # pulls nomic-embed-text and qwen2.5:1.5b (about 1.3 GB)
#   docker compose run --rm ingest          # chunks, embeds and stores the documents
#   docker compose up -d api                # http://localhost:8080
services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: rag
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.6
    volumes: [ollama:/root/.ollama]

  models:
    image: ollama/ollama:0.40.6
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["sh", "-c", "ollama pull nomic-embed-text && ollama pull qwen2.5:1.5b"]
    profiles: [setup]

  ingest:
    build: .
    depends_on: { db: { condition: service_healthy }, ollama: { condition: service_started } }
    environment: &env
      DATABASE_URL: postgres://rag:${POSTGRES_PASSWORD:-rag}@db:5432/rag
      OLLAMA_URL: http://ollama:11434
    volumes: [./data:/app/data:ro]   # its report stays in the container, so the committed results/ are untouched
    command: ["ingest", "-chunkers", "para"]
    user: root
    profiles: [setup]

  api:
    build: .
    depends_on: { db: { condition: service_healthy }, ollama: { condition: service_started } }
    environment:
      <<: *env
      FOOTNOTE_CHUNKER: para
      FOOTNOTE_METHOD: dense
      FOOTNOTE_MIN_SIMILARITY: "0.6392"
      FOOTNOTE_K: "3"
    ports: ["8080:8080"]

volumes:
  pgdata:
  ollama:
